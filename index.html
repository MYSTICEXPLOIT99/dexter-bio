<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; transition: background 0.4s ease, color 0.4s ease; overflow-x: hidden; }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
        .content-layer { position: relative; z-index: 10; }

        /* 1. Dark Mode (Black & Blue Minimal) */
        .theme-dark { background-color: #050505; color: #ffffff; }
        .theme-dark .card { background-color: rgba(15, 15, 15, 0.85); backdrop-filter: blur(8px); border: 1px solid #1f1f1f; }
        .theme-dark .card:hover { border-color: #0066ff; }
        .theme-dark .highlight-btn { background: #0066ff; color: #fff; border: 1px solid #3385ff; box-shadow: 0 0 20px rgba(0, 102, 255, 0.4); }
        .theme-dark .avatar-ring { border-color: #0066ff; box-shadow: 0 0 25px rgba(0, 102, 255, 0.35); }

        /* 2. Light Mode */
        .theme-light { background-color: #f8fafc; color: #0f172a; }
        .theme-light .card { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border: 1px solid #e2e8f0; }
        .theme-light .card:hover { border-color: #0f172a; }
        .theme-light .highlight-btn { background: #0f172a; color: #fff; box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15); }
        .theme-light .avatar-ring { border-color: #0f172a; }

        /* 3. Halloween Theme */
        .theme-halloween { background: radial-gradient(circle at top, #1f0a29 0%, #07040a 100%); color: #fff7ed; }
        .theme-halloween .card { background-color: rgba(24, 12, 32, 0.85); backdrop-filter: blur(8px); border: 1px solid #4c1d95; }
        .theme-halloween .card:hover { border-color: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.25); }
        .theme-halloween .highlight-btn { background: linear-gradient(135deg, #ea580c, #9333ea); color: #fff; border: 1px solid #fb923c; box-shadow: 0 0 22px rgba(249, 115, 22, 0.45); }
        .theme-halloween .avatar-ring { border-color: #f97316; box-shadow: 0 0 25px rgba(249, 115, 22, 0.5); }

        /* 4. Christmas Theme */
        .theme-christmas { background: radial-gradient(circle at top, #06281e 0%, #040d0a 100%); color: #f8fafc; }
        .theme-christmas .card { background-color: rgba(10, 35, 26, 0.85); backdrop-filter: blur(8px); border: 1px solid #14532d; }
        .theme-christmas .card:hover { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.25); }
        .theme-christmas .highlight-btn { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; border: 1px solid #fca5a5; box-shadow: 0 0 22px rgba(220, 38, 38, 0.45); }
        .theme-christmas .avatar-ring { border-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); }
    </style>
</head>
<body class="theme-dark min-h-screen flex flex-col items-center justify-center p-4">

    <canvas id="bgCanvas"></canvas>

    <!-- ปุ่มแชร์ & สลับธีมชั่วคราวมุมขวาบน -->
    <div class="content-layer fixed top-4 right-4 flex gap-2">
        <select id="quickThemeSelect" onchange="changeLocalTheme(this.value)" title="ลองเปลี่ยนธีม" 
                class="px-2.5 py-1.5 rounded-lg bg-black/60 backdrop-blur text-xs border border-white/15 outline-none cursor-pointer">
            <option value="dark">🌑 Dark Blue</option>
            <option value="light">☀️ Light</option>
            <option value="halloween">🎃 Halloween</option>
            <option value="christmas">🎄 Christmas</option>
        </select>
        <button onclick="copyLink()" class="px-3 py-1.5 rounded-lg bg-black/60 backdrop-blur hover:bg-black/80 text-xs border border-white/15 transition">
            <i class="fa-solid fa-share-nodes mr-1"></i> แชร์
        </button>
    </div>

    <div class="content-layer w-full max-w-md mx-auto text-center space-y-6 my-12">
        <div class="relative inline-block">
            <img id="avatarImg" src="" alt="Avatar" class="avatar-ring w-28 h-28 rounded-full object-cover mx-auto border-2 transition-all duration-300">
            <span id="statusBadge" class="absolute bottom-0 right-0 bg-zinc-950/90 text-xs px-2.5 py-1 rounded-full border border-white/15 text-emerald-400">
                ● ออนไลน์
            </span>
        </div>

        <div class="space-y-2">
            <h1 id="displayName" class="text-2xl font-bold tracking-tight">กำลังโหลด...</h1>
            <p id="displayBio" class="text-sm opacity-75 max-w-xs mx-auto"></p>
        </div>

        <div id="socialContainer" class="flex justify-center gap-3 text-lg"></div>
        <div id="linksContainer" class="space-y-3 pt-2"></div>
    </div>

    <script>
        let currentEffect = 'none';
        let animationFrameId = null;

        async function loadBio() {
            try {
                const res = await fetch('/api/bio');
                const data = await res.json();

                const theme = data.theme || 'dark';
                document.getElementById('quickThemeSelect').value = theme;
                applyThemeAndEffect(theme, data.effect);

                document.title = `${data.name} | Bio`;
                document.getElementById('avatarImg').src = data.avatar;
                document.getElementById('displayName').innerText = data.name;
                document.getElementById('displayBio').innerText = data.bio;
                document.getElementById('statusBadge').innerText = `● ${data.status}`;

                const socialIcons = {
                    instagram: 'fa-brands fa-instagram',
                    tiktok: 'fa-brands fa-tiktok',
                    discord: 'fa-brands fa-discord',
                    facebook: 'fa-brands fa-facebook',
                    youtube: 'fa-brands fa-youtube',
                    github: 'fa-brands fa-github',
                    line: 'fa-brands fa-line'
                };

                document.getElementById('socialContainer').innerHTML = (data.socials || []).map(s => `
                    <a href="${s.url}" target="_blank" class="w-10 h-10 rounded-full card flex items-center justify-center hover:scale-110 transition">
                        <i class="${socialIcons[s.platform] || 'fa-solid fa-link'}"></i>
                    </a>
                `).join('');

                document.getElementById('linksContainer').innerHTML = (data.links || []).map(link => `
                    <a href="${link.url}" target="_blank" 
                       class="block w-full py-3.5 px-5 rounded-xl font-medium transition transform hover:-translate-y-0.5 ${link.highlight ? 'highlight-btn' : 'card'}">
                        ${link.title}
                    </a>
                `).join('');
            } catch (e) {
                document.getElementById('displayName').innerText = 'ไม่สามารถโหลดข้อมูลได้';
            }
        }

        function changeLocalTheme(theme) {
            let autoEffect = 'particles';
            if (theme === 'halloween') autoEffect = 'halloween';
            if (theme === 'christmas') autoEffect = 'snow';
            applyThemeAndEffect(theme, autoEffect);
        }

        function applyThemeAndEffect(theme, effect) {
            document.body.className = `theme-${theme} min-h-screen flex flex-col items-center justify-center p-4`;
            // ถ้าตั้งค่า effect เป็น auto ให้เลือกตามธีม
            if (!effect || effect === 'auto') {
                if (theme === 'halloween') effect = 'halloween';
                else if (theme === 'christmas') effect = 'snow';
                else effect = 'particles';
            }
            startCanvasEffect(effect, theme);
        }

        // ระบบเอฟเฟกต์พื้นหลัง Canvas
        function startCanvasEffect(effectType, theme) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.onresize = resize;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (effectType === 'none') return;

            const items = [];
            const count = effectType === 'snow' ? 75 : (effectType === 'halloween' ? 28 : 45);

            for (let i = 0; i < count; i++) {
                items.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 3 + 1.5,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: effectType === 'snow' ? (Math.random() * 1.5 + 0.6) : (Math.random() - 0.5) * 0.8,
                    emoji: ['🎃', '👻', '🦇', '🕸️'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 14 + 14,
                    alpha: Math.random() * 0.6 + 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (effectType === 'snow') {
                    // เอฟเฟกต์หิมะตก (คริสต์มาส)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    items.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                        p.y += p.vy;
                        p.x += Math.sin(p.y * 0.01) * 0.5;
                        if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                    });
                } else if (effectType === 'halloween') {
                    // เอฟเฟกต์ฮาโลวีนลอยไปมา
                    items.forEach(p => {
                        ctx.font = `${p.size}px serif`;
                        ctx.globalAlpha = p.alpha;
                        ctx.fillText(p.emoji, p.x, p.y);
                        p.y -= Math.abs(p.vy) * 0.6 + 0.3;
                        p.x += Math.sin(p.y * 0.015) * 0.8;
                        if (p.y < -30) { p.y = canvas.height + 30; p.x = Math.random() * canvas.width; }
                    });
                    ctx.globalAlpha = 1;
                } else if (effectType === 'particles') {
                    // เอฟเฟกต์จุดแสงเชื่อมเส้น (Cyber / Minimal)
                    const dotColor = theme === 'light' ? '15, 23, 42' : '0, 102, 255';
                    items.forEach((p, idx) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.fillStyle = `rgba(${dotColor}, 0.6)`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        ctx.fill();

                        for (let j = idx + 1; j < items.length; j++) {
                            const p2 = items[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if (dist < 110) {
                                ctx.strokeStyle = `rgba(${dotColor}, ${0.25 * (1 - dist / 110)})`;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    });
                }

                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('คัดลอกลิงก์เรียบร้อย!');
        }

        loadBio();
    </script>
</body>
</html>
